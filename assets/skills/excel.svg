<svg xmlns="http://www.w3.org/2000/svg" width="76" height="82" viewBox="0 0 76 82" fill="none">
  <defs>
    <linearGradient id="cardBg_excel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="excelBackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107c41"/>
      <stop offset="100%" stop-color="#0b552c"/>
    </linearGradient>
    <filter id="excelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="74" height="80" rx="12" fill="url(#cardBg_excel)" stroke="#30363d" stroke-width="1.2"/>
  
  <!-- Centered Microsoft Excel Logo (34x32) -->
  <g transform="translate(21, 13)">
    <!-- Back Page / Sheets Body -->
    <rect x="10" y="2" width="23" height="28" rx="2.5" fill="url(#excelBackGrad)"/>
    
    <!-- Spreadsheet Grid Lines -->
    <line x1="16" y1="8" x2="28" y2="8" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="16" y1="14" x2="28" y2="14" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="16" y1="20" x2="28" y2="20" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="16" y1="25" x2="28" y2="25" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.65" stroke-linecap="round"/>
    <line x1="21" y1="8" x2="21" y2="25" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.65"/>
    
    <!-- Front 'X' Tile with Shadow -->
    <rect x="0" y="7" width="18" height="18" rx="3" fill="#107c41" stroke="#23a55a" stroke-width="0.8" filter="url(#excelShadow)"/>
    <text x="9" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">X</text>
  </g>

  <text x="38" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#c9d1d9" text-anchor="middle">
    Excel
  </text>
</svg>