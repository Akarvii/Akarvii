<svg xmlns="http://www.w3.org/2000/svg" width="360" height="52" viewBox="0 0 360 52" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea4335" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ff7b72" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c5221f" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Icon Container Gradient -->
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea4335" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff7b72" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="gmailRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b72"/>
      <stop offset="100%" stop-color="#ea4335"/>
    </linearGradient>
  </defs>

  <!-- Main Button Container -->
  <rect x="1" y="1" width="358" height="50" rx="10" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Icon Section -->
  <g transform="translate(14, 9)">
    <!-- Icon Container Pill/Square -->
    <rect width="34" height="34" rx="8" fill="url(#iconBgGrad)" stroke="#ea4335" stroke-width="1" stroke-opacity="0.4"/>
    
    <!-- Modern Stylized Envelope Vector -->
    <g transform="translate(7, 8) scale(0.82)">
      <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" fill="url(#gmailRed)"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="60" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f6fc" letter-spacing="0.3">
    Correo Electrónico
  </text>
  <text x="60" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#ff7b72" letter-spacing="0.2">
    danielarevalobussines@gmail.com
  </text>

  <!-- Action Arrow Indicator -->
  <g transform="translate(325, 19)" stroke="#ff7b72" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="2" y1="12" x2="12" y2="2"/>
    <polyline points="4 2 12 2 12 10"/>
  </g>
</svg>
