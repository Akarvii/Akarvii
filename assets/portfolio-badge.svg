<svg xmlns="http://www.w3.org/2000/svg" width="360" height="52" viewBox="0 0 360 52" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Icon Gradients -->
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79c0ff"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>

    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#79c0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Main Button Container -->
  <rect x="1" y="1" width="358" height="50" rx="10" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Icon Section -->
  <g transform="translate(14, 9)">
    <!-- Icon Container Pill/Square -->
    <rect width="34" height="34" rx="8" fill="url(#iconBgGrad)" stroke="#388bfd" stroke-width="1" stroke-opacity="0.4"/>
    
    <!-- Central Modern Tech Web Globe -->
    <g transform="translate(17, 17)">
      <!-- Outer Sphere -->
      <circle cx="0" cy="0" r="9.5" stroke="url(#cyanBlue)" stroke-width="1.4" fill="none" opacity="0.95"/>
      
      <!-- Meridians (Longitudes) -->
      <ellipse cx="0" cy="0" rx="4.2" ry="9.5" stroke="url(#cyanBlue)" stroke-width="1.2" fill="none" opacity="0.85"/>
      <line x1="0" y1="-9.5" x2="0" y2="9.5" stroke="url(#cyanBlue)" stroke-width="1.1" opacity="0.75"/>
      
      <!-- Latitudes -->
      <line x1="-8.5" y1="-3.5" x2="8.5" y2="-3.5" stroke="url(#cyanBlue)" stroke-width="1.1" opacity="0.8"/>
      <line x1="-8.5" y1="3.5" x2="8.5" y2="3.5" stroke="url(#cyanBlue)" stroke-width="1.1" opacity="0.8"/>

      <!-- Dynamic Tech Orbit Ring -->
      <ellipse cx="0" cy="0" rx="13" ry="4.5" stroke="url(#orbitGrad)" stroke-width="1.3" fill="none" transform="rotate(-26)" stroke-dasharray="24 4 12 3"/>
      
      <!-- Glowing Active Orbit Nodes -->
      <circle cx="9.5" cy="-5" r="1.6" fill="#79c0ff" filter="url(#neonGlow)"/>
      <circle cx="-10" cy="4.5" r="1.3" fill="#58a6ff"/>
      <circle cx="0" cy="0" r="1.5" fill="#ffffff" filter="url(#neonGlow)"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="60" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f0f6fc" letter-spacing="0.3">
    Portafolio Web &amp; Proyectos
  </text>
  <text x="60" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#58a6ff" letter-spacing="0.2">
    akarsolutions.dev
  </text>

  <!-- Action Arrow Indicator -->
  <g transform="translate(325, 19)" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="2" y1="12" x2="12" y2="2"/>
    <polyline points="4 2 12 2 12 10"/>
  </g>
</svg>
